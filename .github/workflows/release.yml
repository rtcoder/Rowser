name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

      - name: Build Chrome extension
        run: pnpm build:chrome

      - name: Verify Chrome extension has no remote code
        run: pnpm run verify:no-remote-code

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Chromium E2E tests
        run: xvfb-run -a pnpm test:e2e

      - name: Package Chrome extension
        run: sh scripts/package-extension.sh chrome "$GITHUB_REF_NAME"

      - name: Detect Firefox target
        id: firefox
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts['build:firefox'] ? 0 : 1)" \
            && [ -f extension/firefox/vite.config.ts ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Firefox extension
        if: steps.firefox.outputs.enabled == 'true'
        run: pnpm build:firefox

      - name: Lint Firefox extension
        if: steps.firefox.outputs.enabled == 'true'
        run: pnpm lint:firefox

      - name: Package Firefox extension
        if: steps.firefox.outputs.enabled == 'true'
        run: sh scripts/package-extension.sh firefox "$GITHUB_REF_NAME"

      - name: Prepare release notes
        run: |
          tag="${GITHUB_REF_NAME}"
          awk -v tag="$tag" '
            $0 == "## " tag { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            printf "See CHANGELOG.md for %s.\n" "$tag" > release-notes.md
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"

          if ! gh release create "$tag" artifacts/*.zip --title "$tag" --notes-file release-notes.md; then
            echo "gh release create failed; checking for a partially-created release"
            gh release view "$tag" >/dev/null
            gh release upload "$tag" artifacts/*.zip --clobber
          fi

          for attempt in 1 2 3; do
            if gh release edit "$tag" --draft=false --latest; then
              break
            fi

            if [ "$(gh release view "$tag" --json isDraft --jq '.isDraft')" = "false" ]; then
              break
            fi

            echo "Release publish attempt $attempt failed; retrying"
            sleep 5
          done

          gh release view "$tag" --json isDraft,assets --jq '
            if .isDraft then
              error("release is still a draft")
            elif (.assets | length) == 0 then
              error("release has no assets")
            else
              "release ready"
            end
          '
