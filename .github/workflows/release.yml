name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

      - name: Build Chrome extension
        run: pnpm build:chrome

      - name: Package Chrome extension
        run: sh scripts/package-extension.sh chrome "$GITHUB_REF_NAME"

      - name: Detect Firefox target
        id: firefox
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts['build:firefox'] ? 0 : 1)" \
            && [ -f extension/firefox/vite.config.ts ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Firefox extension
        if: steps.firefox.outputs.enabled == 'true'
        run: pnpm build:firefox

      - name: Package Firefox extension
        if: steps.firefox.outputs.enabled == 'true'
        run: sh scripts/package-extension.sh firefox "$GITHUB_REF_NAME"

      - name: Prepare release notes
        run: |
          tag="${GITHUB_REF_NAME}"
          awk -v tag="$tag" '
            $0 == "## " tag { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            printf "See CHANGELOG.md for %s.\n" "$tag" > release-notes.md
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" artifacts/*.zip \
            --title "$tag" \
            --notes-file release-notes.md
